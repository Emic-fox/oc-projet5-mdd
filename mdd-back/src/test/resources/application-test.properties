# Profil "test" : activé via @ActiveProfiles("test")

# Testcontainers fournit une MariaDB vierge : on laisse Hibernate créer le schéma
spring.jpa.hibernate.ddl-auto=create-drop

# --- SQL / Hibernate logging ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JPQL avant traduction
logging.level.org.hibernate.SQL=debug
# valeurs des paramètres liés (Hibernate 6)
logging.level.org.hibernate.orm.jdbc.bind=trace
