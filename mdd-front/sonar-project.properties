sonar.projectKey=mdd-front
sonar.host.url=http://localhost:9000

sonar.sources=src
sonar.tests=src,e2e
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,src/environments/**

# Rapports lcov des tests unitaires (Vitest) et E2E (Playwright). Sonar fusionne
# les deux ; le second est ignoré (avec un simple avertissement) si le fichier
# n'existe pas encore (`npm run e2e:coverage` non lancé).
sonar.javascript.lcov.reportPaths=coverage/mdd-front/lcov.info,coverage/e2e/lcov.info
